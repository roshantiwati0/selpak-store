<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selpak Store — Checkout</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="cart">
<div id="site-header"></div>

<main class="container">
  <div class="crumbs"><a href="cart.html">Cart</a> / Checkout</div>
  <h1 style="font-size:clamp(24px,3vw,32px)">Checkout</h1>
  <div class="steps" aria-label="Checkout steps">
    <span class="is-done"><i>&#10003;</i>Cart</span><hr>
    <span class="is-on"><i>2</i>Address &amp; payment</span><hr>
    <span><i>3</i>Confirmation</span>
  </div>

  <div class="split">
    <form class="stack" action="order-success.html">
      <section class="card card-pad">
        <div class="block-title"><h3>1. Contact</h3><a href="login.html" class="small">Already have an account? Login</a></div>
        <div class="form-grid">
          <div class="field"><label for="nm">Full name</label><input class="input" id="nm" autocomplete="name" placeholder="Your name"></div>
          <div class="field"><label for="ph">Mobile number</label><input class="input" id="ph" inputmode="tel" autocomplete="tel" placeholder="10-digit mobile number"><span class="hint">Order updates are sent to this number.</span></div>
          <div class="field full"><label for="em">Email (optional)</label><input class="input" id="em" type="email" autocomplete="email" placeholder="For your invoice"></div>
        </div>
      </section>

      <section class="card card-pad">
        <div class="block-title"><h3>2. Delivery address</h3></div>
        <div class="form-grid">
          <div class="field"><label for="pc">Pincode</label><input class="input" id="pc" inputmode="numeric" maxlength="6" placeholder="6-digit pincode"></div>
          <div class="field"><label for="ct">City</label><input class="input" id="ct" placeholder="City"></div>
          <div class="field full"><label for="a1">Flat, building, street</label><input class="input" id="a1" autocomplete="address-line1" placeholder="Address"></div>
          <div class="field"><label for="a2">Area / landmark</label><input class="input" id="a2" placeholder="Landmark"></div>
          <div class="field"><label for="st">State</label><select class="select" id="st"><option>Maharashtra</option></select></div>
        </div>
      </section>

      <section class="card card-pad">
        <div class="block-title"><h3>3. Payment</h3></div>
        <label class="pay is-on"><input type="radio" name="pay" checked>
          <span><b>Pay online</b><small>UPI, credit or debit card, net banking. Secured by Razorpay.</small></span></label>
        <label class="pay"><input type="radio" name="pay">
          <span><b>Cash on delivery</b><small>Pay in cash or UPI when the order arrives.</small></span></label>
      </section>

      <button class="btn btn-primary btn-lg only-mobile" type="submit" style="width:100%">Place order</button>
    </form>

    <aside class="card card-pad summary">
      <h3 style="margin-bottom:6px">Order summary</h3>
      <div id="items"></div>
      <div class="sum-row" style="margin-top:8px"><span>Subtotal</span><span class="price" id="sub"></span></div>
      <div class="sum-row"><span>Delivery</span><span class="price">&#8377;0</span></div>
      <div class="sum-row sum-total"><span>Total</span><span class="price" id="tot"></span></div>
      <a class="btn btn-primary btn-lg btn-block hide-m" href="order-success.html" style="margin-top:16px">Place order</a>
      <p class="hint" style="margin-top:10px;text-align:center">By placing the order you agree to our Terms and Refund policy.</p>
    </aside>
  </div>
</main>

<div id="site-footer"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
const CART = [{ id: "tp-12", qty: 2 }, { id: "kt-4", qty: 1 }, { id: "ft-maxi-100", qty: 3 }];
const each = (l) => byId(l.id).mrp;
document.getElementById("items").innerHTML = CART.map((l) => { const p = byId(l.id); return `
  <div class="line" style="grid-template-columns:56px 1fr auto;padding:10px 0;gap:12px">
    <div class="line-img" style="width:56px;height:56px"><img src="assets/${p.id}.png" alt=""></div>
    <div><div class="line-name small">Selpak ${esc(p.name)}, ${esc(p.size)}</div><div class="small muted">Qty ${l.qty}</div></div>
    <div class="line-total price" style="font-size:14px;grid-column:auto">${inr(each(l) * l.qty)}</div>
  </div>`; }).join("");
const sub = CART.reduce((s, l) => s + each(l) * l.qty, 0);
document.getElementById("sub").textContent = document.getElementById("tot").textContent = inr(sub);
document.querySelectorAll(".pay input").forEach((r) => r.addEventListener("change", () => document.querySelectorAll(".pay").forEach((l) => l.classList.toggle("is-on", l.querySelector("input").checked))));
</script>
</body>
</html>
