<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selpak Store — Shop</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="shop">
<div id="site-header"></div>

<main class="container">
  <div class="crumbs"><a href="home.html">Home</a> / <span id="crumb">All products</span></div>
  <div class="section-head" style="margin-bottom:12px">
    <div><h1 id="title" style="font-size:clamp(24px,3vw,32px)">All products</h1><p id="count"></p></div>
  </div>

  <!-- Mobile: category chips (sidebar ki jagah) -->
  <div class="chips only-mobile" id="chips" style="margin-bottom:12px"></div>

  <div class="shop">
    <aside class="card filters" aria-label="Filters">
      <h4>Category</h4>
      <div id="f-cat"></div>
      <h4>Type</h4>
      <label class="check"><input type="checkbox" data-f="promo"> Promo packs</label>
      <label class="check"><input type="checkbox" data-f="scented"> Scented</label>
      <label class="check"><input type="checkbox" data-f="deluxe"> Deluxe / Premium</label>
      <label class="check"><input type="checkbox" data-f="new"> New</label>
      <h4>Price</h4>
      <label class="check"><input type="radio" name="pr" value="0-99999" checked> Any price</label>
      <label class="check"><input type="radio" name="pr" value="0-300"> Under &#8377;300</label>
      <label class="check"><input type="radio" name="pr" value="300-700"> &#8377;300 to &#8377;700</label>
      <label class="check"><input type="radio" name="pr" value="700-1500"> &#8377;700 to &#8377;1,500</label>
      <label class="check"><input type="radio" name="pr" value="1500-99999"> Above &#8377;1,500</label>
    </aside>

    <div>
      <div class="toolbar">
        <button class="btn btn-secondary btn-sm only-mobile" type="button">Filters</button>
        <span class="muted small hide-m" id="showing"></span>
        <select class="select" id="sort" aria-label="Sort by">
          <option value="rel">Sort: Featured</option>
          <option value="lo">Price: low to high</option>
          <option value="hi">Price: high to low</option>
        </select>
      </div>
      <div class="grid grid-3" id="list"></div>
      <div class="card card-pad" id="empty" hidden style="text-align:center">
        <h3>No products match these filters</h3>
        <p class="muted" style="margin:6px 0 14px">Try removing a filter or choosing another category.</p>
        <a class="btn btn-secondary btn-sm" href="shop.html">Clear filters</a>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
const cat = qs("cat"), q = (qs("q") || "").toLowerCase(), tag0 = qs("tag");
const name = cat ? catName(cat) : q ? `Results for "${esc(q)}"` : "All products";
document.getElementById("title").innerHTML = name;
document.getElementById("crumb").innerHTML = name;
document.getElementById("f-cat").innerHTML =
  `<a class="check" href="shop.html" style="color:inherit;${cat ? "" : "font-weight:700;color:var(--blue-700)"}">All <span>${PRODUCTS.length}</span></a>` +
  CATEGORIES.map((c) => `<a class="check" href="shop.html?cat=${c.id}" style="color:inherit;${cat === c.id ? "font-weight:700;color:var(--blue-700)" : ""}">${c.name} <span>${PRODUCTS.filter((p) => p.cat === c.id).length}</span></a>`).join("");
document.getElementById("chips").innerHTML =
  `<a class="chip ${cat ? "" : "is-on"}" href="shop.html">All</a>` +
  CATEGORIES.map((c) => `<a class="chip ${cat === c.id ? "is-on" : ""}" href="shop.html?cat=${c.id}">${c.name}</a>`).join("");
if (tag0) { const cb = document.querySelector(`[data-f="${tag0}"]`); if (cb) cb.checked = true; }

function draw() {
  const on = [...document.querySelectorAll("[data-f]:checked")].map((i) => i.dataset.f);
  const [lo, hi] = document.querySelector("[name=pr]:checked").value.split("-").map(Number);
  let list = PRODUCTS.filter((p) =>
    (!cat || p.cat === cat) &&
    (!q || (p.name + " " + catName(p.cat) + " " + p.size).toLowerCase().includes(q)) &&
    p.mrp >= lo && p.mrp < hi &&
    on.every((f) => (f === "scented" ? p.scented : p.tag === f)));
  const s = document.getElementById("sort").value;
  if (s === "lo") list = [...list].sort((a, b) => a.mrp - b.mrp);
  if (s === "hi") list = [...list].sort((a, b) => b.mrp - a.mrp);
  document.getElementById("list").innerHTML = list.map(productCard).join("");
  document.getElementById("empty").hidden = list.length > 0;
  document.getElementById("count").textContent = `${list.length} products`;
  document.getElementById("showing").textContent = `Showing ${list.length} of ${PRODUCTS.length}`;
}
document.addEventListener("change", draw);
document.addEventListener("DOMContentLoaded", draw);
</script>
</body>
</html>
