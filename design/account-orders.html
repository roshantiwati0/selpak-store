<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selpak Store — My orders</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="account">
<div id="site-header"></div>

<main class="container">
  <div class="crumbs"><a href="home.html">Home</a> / My account / Orders</div>
  <div class="account">
    <aside class="card side" style="padding:8px 0;overflow:hidden">
      <a href="#" class="is-on">My orders</a>
      <a href="#">Addresses</a>
      <a href="#">Profile</a>
      <a href="login.html">Logout</a>
    </aside>

    <div>
      <h1 style="font-size:clamp(24px,3vw,32px);margin-bottom:12px">My orders</h1>
      <div class="chips" style="margin-bottom:16px">
        <span class="chip is-on">All</span><span class="chip">In progress</span><span class="chip">Delivered</span><span class="chip">Cancelled</span>
      </div>
      <div class="stack" id="orders"></div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
/* Sample data — sirf layout dikhane ke liye */
const ORDERS = [
  { no: "SP-2026-000123", date: "26 Nov 2026", total: 3390, status: ["Out for delivery", "warn"], pay: "Paid online", items: ["tp-12", "kt-4", "ft-maxi-100"], step: 3 },
  { no: "SP-2026-000098", date: "12 Nov 2026", total: 1250, status: ["Delivered", "ok"], pay: "Cash on delivery", items: ["tp-14-4"], step: 4 },
  { no: "SP-2026-000071", date: "02 Nov 2026", total: 595,  status: ["Cancelled", "err"], pay: "Refunded", items: ["hanky-classic", "ww-classic"], step: 0 },
];
const steps = ["Placed", "Packed", "Out for delivery", "Delivered"];
document.getElementById("orders").innerHTML = ORDERS.map((o) => `
  <article class="card card-pad">
    <div class="order-head">
      <div><b style="color:var(--ink)">${o.no}</b> <span class="muted small">(sample)</span><div class="small muted">${o.date} &middot; ${o.pay}</div></div>
      <div style="text-align:right"><span class="badge badge-${o.status[1]}">${o.status[0]}</span><div class="price" style="font-weight:700;color:var(--ink);margin-top:4px">${inr(o.total)}</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div class="order-items">${o.items.map((i) => `<div><img src="assets/${i}.png" alt=""></div>`).join("")}</div>
      <div style="display:flex;gap:8px">
        <a class="btn btn-secondary btn-sm" href="#">View details</a>
        ${o.step === 4 ? '<a class="btn btn-primary btn-sm" href="cart.html">Reorder</a>' : ""}
        ${o.step ? '<a class="btn btn-ghost btn-sm" href="#">Invoice</a>' : ""}
      </div>
    </div>
    ${o.step && o.step < 4 ? `<div class="track">${steps.map((s, i) => `<div class="${i < o.step ? "is-done" : ""}">${s}</div>`).join("")}</div>` : ""}
  </article>`).join("");
</script>
</body>
</html>
