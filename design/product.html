<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selpak Store — Product</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="shop">
<div id="site-header"></div>

<main class="container">
  <div class="crumbs" id="crumbs"></div>
  <div class="pdp" id="pdp"></div>

  <section class="section">
    <div class="section-head"><div><h2>More from this category</h2></div></div>
    <div class="grid" id="related"></div>
  </section>
</main>

<div id="site-footer"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
const p = byId(qs("id")) || byId("tp-12");
const title = `Selpak ${p.name}, ${p.size}`;
document.title = `${title} — Selpak Store`;
document.getElementById("crumbs").innerHTML =
  `<a href="home.html">Home</a> / <a href="shop.html?cat=${p.cat}">${catName(p.cat)}</a> / ${esc(title)}`;

document.getElementById("pdp").innerHTML = `
  <div>
    <div class="gallery-main">${p.tag ? `<span class="badge badge-${p.tag}">${esc(p.tagText)}</span>` : ""}<img src="assets/${p.id}.png" alt="${esc(title)}"></div>
    <div class="thumbs">
      <div class="thumb is-on"><img src="assets/${p.id}.png" alt=""></div>
      <div class="thumb"><img src="assets/${p.id}.png" alt=""></div>
      <div class="thumb"><img src="assets/${p.id}.png" alt=""></div>
    </div>
  </div>
  <div class="pdp-info">
    <div class="eyebrow">${catName(p.cat)}</div>
    <h1 style="margin-top:6px">${esc(title)}</h1>
    <div class="pdp-price price" id="price">${inr(p.mrp)}</div>
    <div class="muted small">MRP, inclusive of all taxes</div>

    <div class="buy-row" style="margin-top:20px">
      <div class="stepper" aria-label="Quantity"><button type="button" data-d="-" aria-label="Decrease">&minus;</button><output>1</output><button type="button" data-d="+" aria-label="Increase">+</button></div>
      <button class="btn btn-primary btn-lg" type="button" id="add">Add to cart &middot; ${inr(p.mrp)}</button>
      <button class="btn btn-secondary btn-lg" type="button">Buy now</button>
    </div>

    <div class="card card-pad" style="margin-top:20px">
      <h3 style="margin-bottom:10px">Check delivery</h3>
      <div class="pin"><input class="input" inputmode="numeric" maxlength="6" placeholder="Enter pincode" aria-label="Pincode"><button class="btn btn-secondary" type="button">Check</button></div>
      <p class="hint" style="margin-top:8px">Cash on delivery and online payment available.</p>
    </div>

    <div class="card card-pad" style="margin-top:16px">
      <h3 style="margin-bottom:6px">Product details</h3>
      <table class="spec">
        <tr><th>Brand</th><td>Selpak</td></tr>
        <tr><th>Category</th><td>${catName(p.cat)}</td></tr>
        <tr><th>Pack size</th><td>${esc(p.size)}</td></tr>
        <tr><th>Barcode (EAN)</th><td>${p.barcode}</td></tr>
        <tr><th>Sold by</th><td>${SELLER.name}, ${SELLER.city}</td></tr>
      </table>
    </div>
  </div>`;

document.getElementById("related").innerHTML =
  PRODUCTS.filter((x) => x.cat === p.cat && x.id !== p.id).slice(0, 4).map(productCard).join("");

document.addEventListener("qty", (e) => {
  document.getElementById("add").innerHTML = `Add to cart &middot; ${inr(p.mrp * e.detail)}`;
});
</script>
</body>
</html>
