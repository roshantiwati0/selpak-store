<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selpak Store — Cart</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="cart">
<div id="site-header"></div>

<main class="container">
  <div class="crumbs"><a href="home.html">Home</a> / Cart</div>
  <h1 style="font-size:clamp(24px,3vw,32px);margin-bottom:16px">Your cart <span class="muted" style="font-size:16px;font-weight:500" id="n"></span></h1>

  <div class="split">
    <div class="card card-pad" id="lines" style="padding-top:4px;padding-bottom:4px"></div>

    <aside class="card card-pad summary">
      <h3 style="margin-bottom:10px">Order summary</h3>
      <div class="sum-row"><span>Subtotal</span><span class="price" id="sub"></span></div>
      <div class="sum-row"><span>Delivery</span><span class="muted">Calculated at checkout</span></div>
      <div class="sum-row sum-total"><span>Total</span><span class="price" id="tot"></span></div>
      <p class="hint" style="margin:4px 0 16px">Prices are MRP, inclusive of all taxes.</p>
      <a class="btn btn-primary btn-lg btn-block" href="checkout.html">Proceed to checkout</a>
      <a class="btn btn-ghost btn-block" href="shop.html" style="margin-top:8px">Continue shopping</a>
    </aside>
  </div>
</main>

<div id="site-footer"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
/* Sample cart */
const CART = [
  { id: "tp-12", qty: 2 },
  { id: "kt-4", qty: 1 },
  { id: "ft-maxi-100", qty: 3 },
];
const each = (l) => byId(l.id).mrp;
function draw() {
  document.getElementById("lines").innerHTML = CART.map((l, i) => {
    const p = byId(l.id);
    return `
    <div class="line" data-i="${i}">
      <a class="line-img" href="product.html?id=${p.id}"><img src="assets/${p.id}.png" alt=""></a>
      <div>
        <a class="line-name" href="product.html?id=${p.id}">Selpak ${esc(p.name)}, ${esc(p.size)}</a>
        <div class="small muted">${inr(each(l))} each</div>
        <div class="line-ctrl">
          <div class="stepper stepper-sm"><button type="button" data-d="-" aria-label="Decrease">&minus;</button><output>${l.qty}</output><button type="button" data-d="+" aria-label="Increase">+</button></div>
          <a href="#" class="small" style="color:var(--red)">Remove</a>
        </div>
      </div>
      <div class="line-total price">${inr(each(l) * l.qty)}</div>
    </div>`;
  }).join("");
  const sub = CART.reduce((s, l) => s + each(l) * l.qty, 0);
  document.getElementById("sub").textContent = inr(sub);
  document.getElementById("tot").textContent = inr(sub);
  document.getElementById("n").textContent = `(${CART.length} items)`;
}
document.addEventListener("qty", (e) => { CART[+e.target.closest(".line").dataset.i].qty = e.detail; draw(); });
draw();
</script>
</body>
</html>
